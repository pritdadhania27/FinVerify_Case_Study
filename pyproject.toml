[project]
name = "finverify-ai"
version = "0.1.0"
description = "A Dual-Channel Agentic Framework for Numerical Hallucination Detection in Financial Document Question Answering"
requires-python = ">=3.12,<3.13"

# Exact resolved versions are pinned in requirements.lock.txt (generated by
# pip freeze). This list is the intent; the lock file is the reproducible truth.
dependencies = [
    "fastapi",
    # Required by FastAPI for multipart/form-data, which is how
    # POST /documents/upload receives a PDF. FastAPI does not pull it in.
    "python-multipart",
    # ASGI server for the FastAPI app. Not imported by any module, so it is
    # only ever needed to RUN the API - but a lock file that cannot start the
    # service it documents is an incomplete lock file.
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "pymupdf",
    "pdfplumber",
    "camelot-py[base]",
    "pytesseract",
    "opencv-python-headless",
    "torch",
    "sentence-transformers",
    "qdrant-client",
    "rank-bm25",
    "langgraph",
    "langchain-core",
    "anthropic",
    "python-dotenv",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # camelot warns per page when a scanned/blank region yields no table. That is
    # expected on a 79-page filing and drowns real output.
    "ignore:No tables found in table area:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Scratch space used by audit subagents. Not project source; excluded so a
# throwaway repro script cannot fail the lint gate.
#
# Alembic version files are GENERATED. Reformatting them to the project style
# means the next `alembic revision --autogenerate` produces a file that fails
# lint again, so the choice is between reformatting on every migration or
# excluding them once. `env.py` is generated from a template too and keeps its
# import order for the same reason. The migrations themselves are still
# reviewed - exclusion is from the formatter, not from reading them.
extend-exclude = [".tmp_audit", "backend/database/migrations"]

# Selected explicitly. Without this, the rule set is whatever the installed ruff
# version happens to default to, so the lint baseline shifts under the project on
# upgrade - which is how a clean repo suddenly reports 113 findings none of which
# anyone introduced. The set below is chosen for correctness rather than style:
#   E,W,F  syntax, names, unused
#   B      bugbear - real bug patterns (mutable defaults, loop-variable capture)
#   DTZ    naive datetimes; a local-vs-UTC day boundary silently mis-tracked the
#          free-tier quota window (found by exactly this rule)
#   ISC    implicit string concatenation - catches a missing comma in a literal
#   UP     syntax that is obsolete on the pinned Python
[tool.ruff.lint]
select = ["E", "W", "F", "B", "DTZ", "ISC", "UP"]
ignore = [
    # UP042 wants `class ChunkKind(StrEnum)` over `class ChunkKind(str, Enum)`.
    # Declined: StrEnum changes what `str(member)` and f-string interpolation
    # produce, and these enums cross a Pydantic and a JSON-payload boundary. The
    # rewrite buys nothing and risks a silent serialisation change, which is the
    # one category of change this project can least afford.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Scripts insert the repo root on sys.path before importing backend packages, so
# their imports legitimately follow executable statements.
"scripts/*.py" = ["E402"]
