<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dual-channel numerical QA over financial reports, with consistency verification."
    />
    <title>FinVerify-AI</title>
    <!--
      IBM Plex, in three voices: Serif for headings and headline figures (the
      register annual reports are actually set in), Sans for interface text, Mono
      for every figure, run id and hash. Loaded from Google Fonts with a full
      fallback stack behind each one, because the stack is demonstrated on a
      laptop that may have no network - a missing webfont must degrade to a
      sensible system face, not to Times.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
