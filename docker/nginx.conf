server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Static assets are content-hashed by Vite, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The API is a separate container. Proxying here means the browser makes
    # same-origin requests and the backend needs no CORS configuration - which
    # matters because a permissive CORS policy on a service that can spend
    # free-tier quota is a way to lose it.
    location /api/ {
        # ${API_UPSTREAM} is filled in by the nginx image's template step at
        # container start. Default: the web-only API container. The live-question
        # demo points it at the API running from the project venv, which has the
        # research engine the container deliberately lacks (RUN_LIVE_DEMO.bat).
        proxy_pass http://${API_UPSTREAM}/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A live question measured 167 s inside the pipeline, and 691 s and 651 s on
        # 2026-09-13 when the program channel's provider timed out on read. The
        # 691 s answer was saved,
        # but only after this proxy had given up at 600 s and the page had told
        # the user the API was down. The pipeline keeps running when the proxy
        # stops waiting, so a timeout here costs the answer on screen, not the
        # answer - and the frontend's deadline must stay above this one.
        proxy_read_timeout 900s;

        # Annual reports are 9-20 MB; four of the five in this corpus exceed
        # nginx's 1 MB default, so document upload - the SPA's only body-heavy
        # endpoint - returned 413 for every real filing and could not succeed
        # at all. 64 MB covers the largest Indian integrated report seen here
        # with room to spare, and the API still validates the content itself.
        client_max_body_size 64m;
    }

    # Hash routing means every path resolves to index.html anyway, but a direct
    # hit on an unknown path should still serve the app rather than a 404 page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
